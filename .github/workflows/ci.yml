name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel in-flight runs on main so rapid merges don't leave gaps in
  # main's CI history; PR branches cancel superseded runs as usual.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    # Name is a required branch-protection context on main — do not rename
    # without updating protection.
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm check:format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

  build:
    # Name is a required branch-protection context on main — do not rename
    # without updating protection.
    name: Production build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Tar before upload: artifact upload/download does not preserve file
      # permissions or symlinks, and `next start` needs a faithful .next dir.
      # `.next/cache` is excluded -- it is only useful for incremental builds.
      - name: Pack build output
        run: tar --exclude='./.next/cache' -cf next-build.tar ./.next

      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: next-build.tar
          if-no-files-found: error
          retention-days: 7

  browser-contracts:
    # Name is a required branch-protection context on main — do not rename
    # without updating protection.
    name: Browser contracts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - uses: actions/download-artifact@v8
        with:
          name: next-build

      - name: Unpack build output
        run: tar -xf next-build.tar

      # Playwright starts the production server itself on port 3100
      # (playwright.config.ts webServer: `pnpm start --port 3100`).
      - name: Browser contract tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  dependency-report:
    name: Dependency report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      # No `cache: pnpm` here: this job never runs `pnpm install`, so the
      # pnpm store directory is never created and setup-node's post-run cache
      # save fails on any lockfile change (cache-key miss -> save of a
      # nonexistent path).
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # No `pnpm install` here: `pnpm audit` works off package.json and the
      # lockfile and does not need node_modules.

      # Non-blocking by design: the audit surfaces findings in the job summary
      # but never fails CI. Remediation is tracked by Task 11 (dependency
      # modernization) of docs/plans/2026-07-10-blog-platform-modernization.md.
      - name: Audit production dependencies
        run: |
          set +e
          output="$(pnpm audit --prod 2>&1)"
          status=$?
          {
            echo '## pnpm audit --prod'
            echo ''
            echo '```'
            echo "$output"
            echo '```'
            if [ "$status" -ne 0 ]; then
              echo ''
              echo '> Audit exited non-zero (findings or audit error above). Non-blocking; remediation tracked by the dependency modernization task (Task 11).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          exit 0
